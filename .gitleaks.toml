# gitleaks: regole di default + regole specifiche di M4TR1X (I-28)
[extend]
useDefault = true

[[rules]]
id = "nostr-nsec"
description = "Chiave privata Nostr (nsec)"
regex = '''\bnsec1[02-9ac-hj-np-z]{58}\b'''

[[rules]]
id = "minisign-secret"
description = "Chiave segreta minisign"
regex = '''untrusted comment: minisign encrypted secret key'''

[[rules]]
id = "onion-v3"
description = "Indirizzo onion v3 (non deve stare nel repo)"
regex = '''\b[a-z2-7]{56}\.onion\b'''

[allowlist]
description = "Esempi finti dei test dello scanner"
paths = [
  '''tests/invariants/inv-28-secrets\.test\.js''',
  '''tools/security/scan-secrets\.js''',
]
