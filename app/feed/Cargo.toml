[package]
name = "m4tr1x-feed"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Feed dell'app M4TR1X: ultimi post del nodo via Tor, verificati in Rust, con tentativi e fase mostrata"

# Versioni esatte (I-25). Nessuna libreria di rete (I-36): la rete passa da m4tr1x-transport.
[dependencies]
m4tr1x-transport = { path = "../transport" }
m4tr1x-protocol = { path = "../protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", default-features = false, features = ["time"] }

[dev-dependencies]
m4tr1x-transport = { path = "../transport", features = ["prova"] }
# firmare i post di prova con il seme PUBBLICO di prova
m4tr1x-identity = { path = "../identity" }
# examples/file.rs: pulizia del file prima del caricamento di prova
m4tr1x-media = { path = "../media" }
# examples/celle.rs: una foto a celle (alveare) caricata e riscaricata pezzo per pezzo
m4tr1x-celle = { path = "../celle" }
tokio = { version = "=1.53.3", default-features = false, features = ["time", "io-util", "rt-multi-thread", "macros", "test-util"] }

# examples/misura.rs: prova di fine corsa con un nodo vero via Tor (solo prove)
[[example]]
name = "misura"

# examples/pubblica.rs: pubblicazione di un post firmato via Tor su un nodo vero (solo prove)
[[example]]
name = "pubblica"

# examples/forum.rs: discussione e risposta su un nodo vero via Tor (solo prove)
[[example]]
name = "forum"

# examples/file.rs: caricamento e riscaricamento di un file su un nodo vero via Tor (solo prove)
[[example]]
name = "file"

# examples/celle.rs: foto a celle su un nodo vero via Tor, riscaricata pezzo per pezzo (solo prove)
[[example]]
name = "celle"
