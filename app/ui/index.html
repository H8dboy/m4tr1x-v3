<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M4TR1X</title>
  <link rel="stylesheet" href="style.css">
  <!-- Regole (I-31, I-01): nessuno script inline, nessun gestore on*=, nessuna
       risorsa esterna. Il JavaScript parla solo con il lato Rust via invoke. -->
  <script src="main.js" defer></script>
</head>
<body>
  <main class="guscio">
    <header class="testata">
      <h1>M4TR1X</h1>
      <p class="sotto">v<span id="versione">—</span></p>
    </header>
    <section class="scheda" aria-live="polite">
      <h2>Identità</h2>
      <div id="senza-identita" hidden>
        <p>Non hai ancora un'identità su questo computer.</p>
        <button id="crea">Crea una nuova identità</button>
        <button id="recupera" class="secondario">Recupera dalle 24 parole</button>
      </div>
      <div id="con-identita" hidden>
        <p>La tua chiave pubblica:</p>
        <p class="chiave" id="chiave-identita"></p>
      </div>
    </section>
    <section class="scheda" aria-live="polite">
      <h2>Rete</h2>
      <p>Tor: <strong id="trasporto">—</strong> <span id="percento"></span></p>
    </section>
    <section class="scheda">
      <h2>Feed</h2>
      <p class="riga-feed">
        <button id="aggiorna-feed">Aggiorna</button>
        <span id="feed-stato" class="tenue" aria-live="polite"></span>
      </p>
      <ol id="feed-lista" class="feed"></ol>
    </section>
  </main>
</body>
</html>
