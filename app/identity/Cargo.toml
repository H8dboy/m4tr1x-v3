[package]
name = "m4tr1x-identity"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Chiavi dell'utente dal seme (BIP-39 + HKDF, ruoli identity/dm/revoke/wallet): stesse chiavi di packages/keys"

# Versioni esatte (I-25). Nessuna libreria di rete (I-36).
[dependencies]
bip39 = { version = "=2.2.2", default-features = false, features = ["std"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
k256 = { version = "=0.14.0", default-features = false, features = ["std", "schnorr"] }
ml-dsa = "=0.1.1"
zeroize = { version = "=1.8.2", features = ["zeroize_derive"] }
getrandom = "=0.3.4"
thiserror = "=2.0.21"
# portachiavi del sistema (Gestione credenziali su Windows); nessuna rete
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
