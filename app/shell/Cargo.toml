[package]
name = "m4tr1x-shell"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Guscio desktop di M4TR1X (Tauri 2): interfaccia + lato Rust con chiavi e firma (I-31)"

[lib]
name = "m4tr1x_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Versioni esatte (I-25). Nessuna libreria di rete qui: la rete passa SOLO da
# m4tr1x-transport (I-36), controllato da tests/invariants/inv-36-transport-only.test.js.
[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
m4tr1x-transport = { path = "../transport" }
m4tr1x-identity = { path = "../identity" }
# registro dei crash su file, senza dati dell'utente
m4tr1x-crash = { path = "../crash" }
# feed: ultimi post del nodo via Tor, verificati in Rust
m4tr1x-feed = { path = "../feed" }
m4tr1x-protocol = { path = "../protocol" }
# solo timer (attesa di tor pronto nel feed); niente rete (I-36)
tokio = { version = "=1.53.3", default-features = false, features = ["time"] }
zeroize = "=1.8.2"

# Blocco delle catture dello schermo sulla finestra del seme (I-58). Già nel lockfile via Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Runtime finto di Tauri, solo per le prove: i comandi passano dalla vera IPC senza finestra (I-31 dinamica,
# tests/i31_ipc.rs). Stessa versione esatta; nessuna libreria nuova nel lockfile (verificato il 21/10/2026).
[dev-dependencies]
tauri = { version = "=2.12.4", features = ["test"] }
