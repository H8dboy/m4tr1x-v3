[package]
name = "m4tr1x-spike-f4a"
version = "0.1.0"
edition = "2021"
publish = false
description = "Prototipo F4a: Tauri 2 + Arti come client verso servizi onion (usa e getta)"

[lib]
name = "spike_f4a_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "time", "sync", "rt-multi-thread"] }
# Arti: solo client, TLS in Rust (niente OpenSSL su Android), SQLite incorporato
arti-client = { version = "=0.47.0", default-features = false, features = [
  "tokio", "rustls", "onion-service-client", "static-sqlite", "compression",
] }
# Log solo nella modalità --bench del prototipo
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Provider crittografico di rustls: ring (compila su Android senza OpenSSL)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
