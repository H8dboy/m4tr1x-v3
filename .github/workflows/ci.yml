# CI di M4TR1X v3 (fase F0)
# - test: tutte le invarianti attive, con lo stesso runner di `npm run report`
#   (tools/report/esegui.js: un file che non risponde, esce prima o non ha test conta
#   come FALLITO; stessi tempi massimi ovunque)
# - secrets: gitleaks sulla storia intera + scanner M4TR1X sui file tracciati
# - deps: audit delle dipendenze (npm audit; cargo deny e cargo audit sull'app Rust, dalla F4)
# - release-gate: sui tag v*, nessuna pubblicazione senza release.json firmato (I-23)
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      # Versioni esatte del lockfile, senza eseguire script d'installazione (supply chain)
      - name: Dipendenze
        run: npm ci --ignore-scripts
      - name: Controllo dei tipi (ADR-0012)
        run: npx tsc -p tsconfig.json
      - name: Invarianti
        run: node tools/report/esegui.js tests

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # storia intera, non solo l'ultimo commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Scanner M4TR1X (I-28)
        run: node tools/security/scan-secrets.js
      - name: gitleaks (storia intera)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: npm audit (I-25)
        run: |
          found=0
          for lock in $(git ls-files '*package-lock.json'); do
            found=1
            (cd "$(dirname "$lock")" && npm audit --audit-level=high)
          done
          [ "$found" = 0 ] && echo "nessuna dipendenza npm: niente da controllare" || true
      # Rust (app/), attivati in F4: binari ufficiali con versione e SHA-256 fissati (come tor.exe e le Actions).
      # cargo-deny pubblica le somme (verificate il 20/10/2026); cargo-audit no: hash fissato al primo
      # scaricamento dalla release ufficiale (rustsec/rustsec, 20/10/2026). Cambiare versione = cambiare l'hash qui.
      - name: Strumenti Rust (versione e hash fissati)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo deny.tgz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  deny.tgz" | sha256sum -c -
          curl -fsSLo audit.tgz "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  audit.tgz" | sha256sum -c -
          tar xzf deny.tgz && tar xzf audit.tgz
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Licenze, sorgenti, avvisi e I-36 sull'albero INTERO delle dipendenze (app/deny.toml)
      - name: cargo deny (I-25, I-36)
        working-directory: app
        run: cargo-deny --locked check
      # Vulnerabilità note (RustSec); eccezioni in app/.cargo/audit.toml, uguali a deny.toml
      - name: cargo audit (I-25)
        working-directory: app
        run: cargo-audit audit --deny warnings

  # Prova di accettazione F2 via Tor vero: due nodi si scambiano evento e file
  tor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Tor dai pacchetti Ubuntu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tor && tor --version | head -1
      - run: npm ci --ignore-scripts
      # Riscaldamento: tor senza onion fino al 100%, consenso salvato nella cache del job
      # (solo file pubblici firmati, mai chiavi; cache dentro questo job, mai tra job).
      # Così un rosso nei passi sotto vuol dire "il nostro codice è rotto", non "rete lenta".
      - name: Riscaldamento della cache di tor
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/tor/riscalda.js
      # --senza-saltati: qui tor c'è, una prova saltata vorrebbe dire che non ha girato
      - name: Due nodi via Tor
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/report/esegui.js --senza-saltati tests/integration/two-nodes.test.js
      - name: Porta di controllo, pubblicazione, riconnessione del tor del nodo (I-59)
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/report/esegui.js --senza-saltati tests/invariants/inv-59-node-tor-control.test.js
      - name: Trasporto dell'app con tor vero (I-37)
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/report/esegui.js --senza-saltati tests/invariants/inv-37-tor-process.test.js
      # F4: il feed dell'app legge via Tor i post verificati di un nodo vero (e misura le riaperture)
      - name: Feed dell'app via Tor (fine corsa)
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/report/esegui.js --senza-saltati tests/integration/feed-via-tor.test.js
      # Misura a freddo (nodo nuovo al primo avvio): NON bloccante, finisce nel riepilogo del job.
      - name: Misura a freddo della rete Tor (non bloccante)
        if: always()
        continue-on-error: true
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/tor/misura.js 1

  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, secrets, deps]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Dipendenze (servono al verificatore ML-DSA)
        run: npm ci --ignore-scripts
      # I pacchetti e il release.json firmato offline vengono messi in release/
      # dal processo di build (dalla F8). Senza firma valida il job fallisce e
      # nessun passo di pubblicazione può seguirlo.
      - name: Verifica release firmata (I-23)
        run: node tools/release/verify-release.js release/
