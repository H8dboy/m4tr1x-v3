# CI di M4TR1X v3 (fase F0)
# - test: tutte le invarianti attive (node --test)
# - secrets: gitleaks sulla storia intera + scanner M4TR1X sui file tracciati
# - deps: audit delle dipendenze (npm audit; cargo deny dalla F4)
# - release-gate: sui tag v*, nessuna pubblicazione senza release.json firmato (I-23)
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      # Versioni esatte del lockfile, senza eseguire script d'installazione (supply chain)
      - name: Dipendenze
        run: npm ci --ignore-scripts
      - name: Controllo dei tipi (ADR-0012)
        run: npx tsc -p tsconfig.json
      - name: Invarianti
        run: node --test "tests/**/*.test.js"

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # storia intera, non solo l'ultimo commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Scanner M4TR1X (I-28)
        run: node tools/security/scan-secrets.js
      - name: gitleaks (storia intera)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: npm audit (I-25)
        run: |
          found=0
          for lock in $(git ls-files '*package-lock.json'); do
            found=1
            (cd "$(dirname "$lock")" && npm audit --audit-level=high)
          done
          [ "$found" = 0 ] && echo "nessuna dipendenza npm: niente da controllare" || true

  # Prova di accettazione F2 via Tor vero: due nodi si scambiano evento e file
  tor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Tor dai pacchetti Ubuntu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tor && tor --version | head -1
      - run: npm ci --ignore-scripts
      - name: Due nodi via Tor
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node --test tests/integration/two-nodes.test.js

  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, secrets, deps]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Dipendenze (servono al verificatore ML-DSA)
        run: npm ci --ignore-scripts
      # I pacchetti e il release.json firmato offline vengono messi in release/
      # dal processo di build (dalla F8). Senza firma valida il job fallisce e
      # nessun passo di pubblicazione può seguirlo.
      - name: Verifica release firmata (I-23)
        run: node tools/release/verify-release.js release/
