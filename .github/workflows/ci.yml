# CI di M4TR1X v3 (fase F0)
# - test: tutte le invarianti attive, con lo stesso runner di `npm run report`
#   (tools/report/esegui.js: un file che non risponde, esce prima o non ha test conta
#   come FALLITO; stessi tempi massimi ovunque)
# - secrets: gitleaks sulla storia intera + scanner M4TR1X sui file tracciati
# - deps: audit delle dipendenze (npm audit; cargo deny e cargo audit sull'app Rust, dalla F4)
# - release-gate: sui tag v*, nessuna pubblicazione senza release.json firmato (I-23)
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      # Versioni esatte del lockfile, senza eseguire script d'installazione (supply chain)
      - name: Dipendenze
        run: npm ci --ignore-scripts
      - name: Controllo dei tipi (ADR-0012)
        run: npx tsc -p tsconfig.json
      # Librerie di sistema per compilare il guscio Tauri su Linux (prerequisiti ufficiali di Tauri 2):
      # servono alla prova dinamica di I-31 (app/shell/tests/i31_ipc.rs), dal 21/10/2026; ipset e acl a inv-01-rete
      - name: Librerie del guscio (WebKitGTK)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev ipset acl
      - name: Invarianti
        run: node tools/report/esegui.js tests

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # storia intera, non solo l'ultimo commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Scanner M4TR1X (I-28)
        run: node tools/security/scan-secrets.js
      - name: gitleaks (storia intera)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: npm audit (I-25)
        run: |
          found=0
          for lock in $(git ls-files '*package-lock.json'); do
            found=1
            (cd "$(dirname "$lock")" && npm audit --audit-level=high)
          done
          [ "$found" = 0 ] && echo "nessuna dipendenza npm: niente da controllare" || true
      # Rust (app/), attivati in F4: binari ufficiali con versione e SHA-256 fissati (come tor.exe e le Actions).
      # cargo-deny pubblica le somme (verificate il 20/10/2026); cargo-audit no: hash fissato al primo
      # scaricamento dalla release ufficiale (rustsec/rustsec, 20/10/2026). Cambiare versione = cambiare l'hash qui.
      - name: Strumenti Rust (versione e hash fissati)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo deny.tgz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  deny.tgz" | sha256sum -c -
          curl -fsSLo audit.tgz "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  audit.tgz" | sha256sum -c -
          tar xzf deny.tgz && tar xzf audit.tgz
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Licenze, sorgenti, avvisi e I-36 sull'albero INTERO delle dipendenze (app/deny.toml)
      - name: cargo deny (I-25, I-36)
        working-directory: app
        run: cargo-deny --locked check
      # Vulnerabilità note (RustSec); eccezioni in app/.cargo/audit.toml, uguali a deny.toml
      - name: cargo audit (I-25)
        working-directory: app
        run: cargo-audit audit --deny warnings

  # Prova di accettazione F2 via Tor vero: due nodi si scambiano evento e file
  tor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Tor dai pacchetti Ubuntu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tor && tor --version | head -1
      - run: npm ci --ignore-scripts
      # Riscaldamento: tor senza onion fino al 100%, consenso salvato nella cache del job
      # (solo file pubblici firmati, mai chiavi; cache dentro questo job, mai tra job).
      # Così un rosso nei passi sotto vuol dire "il nostro codice è rotto", non "rete lenta".
      - name: Riscaldamento della cache di tor
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/tor/riscalda.js
      # --senza-saltati: qui tor c'è, una prova saltata vorrebbe dire che non ha girato
      - name: Due nodi via Tor
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/report/esegui.js --senza-saltati tests/integration/two-nodes.test.js
      - name: Porta di controllo, pubblicazione, riconnessione del tor del nodo (I-59)
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/report/esegui.js --senza-saltati tests/invariants/inv-59-node-tor-control.test.js
      # Il tor che l'APP usa su Linux (21/10/2026, ADR-0016 aggiornata): bundle ufficiale indicato dal lock,
      # hash del bundle controllato prima di estrarlo; tor e librerie poi riverificati dall'app stessa.
      # Da qui M4TR1X_TOR_DEL_LOCK è impostata: la prova di avvio dalla copia non può risultare saltata.
      - name: Tor del lock Linux (bundle verificato)
        run: |
          url=$(node -p "require('./app/tor-linux.lock.json').bundle_url")
          sha=$(node -p "require('./app/tor-linux.lock.json').bundle_sha256")
          curl -fsSLo "$RUNNER_TEMP/tor-bundle.tgz" "$url"
          echo "$sha  $RUNNER_TEMP/tor-bundle.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tor-bundle"
          tar -xzf "$RUNNER_TEMP/tor-bundle.tgz" -C "$RUNNER_TEMP/tor-bundle" tor/tor tor/libcrypto.so.3 tor/libssl.so.3 tor/libevent-2.1.so.7
          echo "M4TR1X_TOR_DEL_LOCK=$RUNNER_TEMP/tor-bundle/tor/tor" >> "$GITHUB_ENV"
      - name: Trasporto dell'app con tor vero (I-37)
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/report/esegui.js --senza-saltati tests/invariants/inv-37-tor-process.test.js
      # F4: il feed dell'app legge via Tor i post verificati di un nodo vero (e misura le riaperture)
      - name: Feed dell'app via Tor (fine corsa)
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/report/esegui.js --senza-saltati tests/integration/feed-via-tor.test.js
      # Misura a freddo (nodo nuovo al primo avvio): NON bloccante, finisce nel riepilogo del job.
      - name: Misura a freddo della rete Tor (non bloccante)
        if: always()
        continue-on-error: true
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/tor/misura.js 1

  # I-01 dinamica (decisioni del fondatore, 21/10/2026, opzione A): l'app VERA, guidata con WebDriver, gira
  # come utente dedicato m4app; iptables ammette per lui solo il loopback (meno ogni resolver locale) e i relay
  # Tor (elenco da fonti verificate, tools/i01/consentiti.js); tutto il resto si conta. Verde solo con 0
  # violazioni E traffico vero verso i relay e sul loopback. Limite in I-01: relay come destinazione non visto.
  i01-rete:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - name: Pacchetti (WebKitGTK, WebKitWebDriver, Xvfb, ipset, ACL, tor di Ubuntu per il nodo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb xauth dbus ipset acl tor
      - name: Versioni di WebKitWebDriver e WebKitGTK (firme apt di Ubuntu)
        run: dpkg-query -W -f='${Package} ${Version}\n' webkit2gtk-driver libwebkit2gtk-4.1-0
      - name: tauri-driver (versione e hash fissati)
        run: |
          L=tools/i01/strumenti.lock.json
          url=$(node -p "require('./$L').tauri_driver.crate_url")
          sha=$(node -p "require('./$L').tauri_driver.crate_sha256")
          ver=$(node -p "require('./$L').tauri_driver.versione")
          curl -fsSLo "$RUNNER_TEMP/tauri-driver.crate" "$url"
          echo "$sha  $RUNNER_TEMP/tauri-driver.crate" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/td-src"
          tar -xzf "$RUNNER_TEMP/tauri-driver.crate" -C "$RUNNER_TEMP/td-src"
          cargo install --locked --path "$RUNNER_TEMP/td-src/tauri-driver-$ver" --root "$RUNNER_TEMP/td"
      - name: App (guscio)
        run: cargo build --locked --manifest-path app/Cargo.toml -p m4tr1x-shell
      - name: Tor del lock Linux (bundle verificato)
        run: |
          url=$(node -p "require('./app/tor-linux.lock.json').bundle_url")
          sha=$(node -p "require('./app/tor-linux.lock.json').bundle_sha256")
          curl -fsSLo "$RUNNER_TEMP/tor-bundle.tgz" "$url"
          echo "$sha  $RUNNER_TEMP/tor-bundle.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tor-bundle"
          tar -xzf "$RUNNER_TEMP/tor-bundle.tgz" -C "$RUNNER_TEMP/tor-bundle" tor/tor tor/libcrypto.so.3 tor/libssl.so.3 tor/libevent-2.1.so.7
      # la cartella del runner non è leggibile da altri utenti: app, tor e tauri-driver in /opt/m4i01
      - name: File della prova leggibili dall'utente dell'app
        run: |
          sudo install -d -m 755 /opt/m4i01 /opt/m4i01/tor
          sudo install -m 755 app/target/debug/m4tr1x-shell "$RUNNER_TEMP/td/bin/tauri-driver" /opt/m4i01/
          sudo install -m 755 "$RUNNER_TEMP"/tor-bundle/tor/* /opt/m4i01/tor/
      - name: Riscaldamento della cache di tor (consenso per l'elenco dei relay)
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: node tools/tor/riscalda.js
      - name: Nodo di prova con onion vero (fuori dalle regole dell'utente dell'app)
        env:
          M4TR1X_TOR_BIN: /usr/bin/tor
        run: |
          nohup node tools/i01/nodo.js "$RUNNER_TEMP/onion" > "$RUNNER_TEMP/nodo.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/nodo.pid"
          for i in $(seq 1 600); do
            [ -s "$RUNNER_TEMP/onion" ] && break
            kill -0 "$(cat "$RUNNER_TEMP/nodo.pid")" 2>/dev/null || { cat "$RUNNER_TEMP/nodo.log"; exit 1; }
            sleep 1
          done
          [ -s "$RUNNER_TEMP/onion" ] || { echo 'fase "pubblicazione": nodo non pronto in 10 minuti'; cat "$RUNNER_TEMP/nodo.log"; exit 1; }
          cat "$RUNNER_TEMP/nodo.log"
      - name: Rete dell'utente dell'app (solo relay Tor, nessun resolver locale)
        run: |
          node tools/i01/consentiti.js /opt/m4i01/tor/tor /tmp/m4tr1x-tor-cache/cached-microdesc-consensus > "$RUNNER_TEMP/m4relay.ipset"
          sudo bash tools/i01/rete.sh prepara "$RUNNER_TEMP/m4relay.ipset"
      - name: Controllo positivo (le regole vedono e bloccano)
        run: sudo bash tools/i01/rete.sh controllo
      - name: App vera guidata con WebDriver, come utente dedicato
        run: |
          sudo -u m4app env -i HOME=/home/m4app PATH=/usr/bin:/bin M4TR1X_TOR_BIN=/opt/m4i01/tor/tor M4TR1X_NODO_PROVA="$(cat "$RUNNER_TEMP/onion")" \
            xvfb-run -a dbus-run-session -- /opt/m4i01/tauri-driver --port 4444 > "$RUNNER_TEMP/driver.log" 2>&1 &
          node tools/i01/prova.js /opt/m4i01/m4tr1x-shell || { echo '--- tauri-driver/app:'; tail -n 80 "$RUNNER_TEMP/driver.log"; exit 1; }
      - name: Contatori (I-01)
        if: always()
        run: |
          sudo bash tools/i01/rete.sh conta | tee "$RUNNER_TEMP/conta.txt" | node tools/i01/verifica.js || { echo '--- pacchetti registrati:'; sudo dmesg | grep 'M4-I01 ' | tail -n 40; exit 1; }
      - name: Pulizia
        if: always()
        run: |
          sudo pkill -u m4app || true
          kill "$(cat "$RUNNER_TEMP/nodo.pid" 2>/dev/null)" 2>/dev/null || true
          sudo bash tools/i01/rete.sh pulisci || true

  # Sabotaggi delle difese che esistono SOLO su Linux (21/10/2026, richiesta del fondatore): cartella della
  # copia di tor 0700, tor avviato con l'ambiente pulito. Su Windows risultano "altra-piattaforma": senza
  # questo job non girerebbero mai. Base verde prima di ogni sabotaggio; nessuna prova scelta = errore.
  sabotaggio-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      # le regole vere di I-01 (tools/i01/rete.sh) servono a inv-01-rete
      - name: Strumenti di rete di I-01
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ipset acl
      - name: Sabotaggi delle difese solo Linux
        run: node tools/sabotage/run.js --piattaforma-attuale

  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, secrets, deps]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Dipendenze (servono al verificatore ML-DSA)
        run: npm ci --ignore-scripts
      # I pacchetti e il release.json firmato offline vengono messi in release/
      # dal processo di build (dalla F8). Senza firma valida il job fallisce e
      # nessun passo di pubblicazione può seguirlo.
      - name: Verifica release firmata (I-23)
        run: node tools/release/verify-release.js release/
